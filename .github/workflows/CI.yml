name: PeriLab CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "app/**"
      - "test/**"
      - "Project.toml"
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "Project.toml"
    branches-ignore:
      - release

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    strategy:
      # Without setting this, a failing test cancels all others
      fail-fast: false
      matrix:
        # We test quite a lot of versions because we do some OS and version specific things unfortunately
        julia-version: ["1.12"]
        os: [ubuntu-latest]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache
        uses: julia-actions/cache@v3
      - name: Run Tests
        uses: julia-actions/julia-runtest@v1
        env:
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
          CONTENT_SIGNING_SECRET: ${{ secrets.CONTENT_SIGNING_SECRET }}
      - name: Archive Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{matrix.julia-version}}
          path: test/fullscale_tests/
          if-no-files-found: error
          retention-days: 30
      - name: Process Coverage
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload Coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: PeriHub/PeriLab.jl
          files: lcov.info
  build:
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # JuliaC peaks above the runner's 16 GB RAM; swap keeps it from being OOM-killed
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Build Docker image
        run: |
          # log memory/disk every 30 s so an OOM kill shows up in the log
          (while true; do free -m | awk 'NR==2{m=$3"/"$2} NR==3{print "mem used MB:",m,"swap used MB:",$3}'; df -h / | tail -1; sleep 30; done) &
          docker build -t perihub/perilab:nightly .
      - name: Publish to Registry
        run: docker push perihub/perilab:nightly
