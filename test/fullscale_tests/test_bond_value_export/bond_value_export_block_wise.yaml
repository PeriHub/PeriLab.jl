PeriLab:
  Discretization:
    Node Sets:
      Node Set 1: 1 2 7 8 13 14
      Node Set 2: 3 4 9 10 15 16
      Node Set 3: 5 6 11 12 17 18
      Node Set 4: 1:3
      Node Set 5: nodeset.txt
    Type: "Text File"
    Input Mesh File: "test_mesh.txt"
  Models:
    Material Models:
      Mat_1:
        Material Model: "PD Solid Elastic"
        Young's Modulus: 70000.0
        Poisson's Ratio: 0.3
    Damage Models:
      Dam_1:
        Damage Model: "Critical Stretch"
        Critical Value: 0.1
        Only Tension: False
  Blocks:
    block_1:
      Block ID: 1
      Density: 1.95e-06
      Horizon: 2.1
      Material Model: Mat_1
    block_2:
      Block ID: 2
      Density: 1.95e-06
      Horizon: 2.1
      Material Model: Mat_1
      Damage Model: Dam_1
    block_3:
      Block ID: 3
      Density: 1.95e-06
      Horizon: 2.1
      Material Model: Mat_1
  Boundary Conditions:
    BC_1:
      Variable: Displacements
      Node Set: Node Set 1
      Coordinate: x
      Value: 0
      Type: Dirichlet
    BC_2:
      Variable: Displacements
      Node Set: Node Set 3
      Coordinate: x
      Value: 1000*t
      Type: Dirichlet
  Solver:
    Damage Models: True
    Initial Time: 0.0
    Final Time: 5.0e-5
    Verlet:
      Fixed dt: 5.0e-6
      Safety Factor: 1.0
  Outputs:
    Output1:
      Output Filename: "bond_value_export_block_wise"
      Output File Type: Exodus
      Output Frequency: 1
      Bond Export: true
      Bond Blocks: 1
      Output Variables:
        Displacements: True
        Damage: True
        Bond Stretch: True
        Deformed Bond Geometry: True
