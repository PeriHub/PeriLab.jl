# Damage only in block_2 (right quarter of the strip): run on 2 ranks, one rank holds
# no damage block, but all ranks must still exchange the damage model's fields.
PeriLab:
  Discretization:
    Node Sets:
      Node Set 1: "x > 18.5"
      Node Set 2: "x < 0.5"
    Type: "Text File"
    Input Mesh File: "test_mesh_strip.txt"
  Models:
    Material Models:
      Mat_1:
        Material Model: "PD Solid Elastic"
        Bulk Modulus: 2.5e+3
        Shear Modulus: 1.15e3
    Damage Models:
      Dam_1:
        Damage Model: "Critical Energy"
        Critical Value: 0.1
  Blocks:
    block_1:
      Block ID: 1
      Material Model: "Mat_1"
      Density: 2.7e-9
      Horizon: 2.1
    block_2:
      Block ID: 2
      Material Model: "Mat_1"
      Damage Model: Dam_1
      Density: 2.7e-9
      Horizon: 2.1
  Boundary Conditions:
    BC_1:
      Variable: "Displacements"
      Node Set: "Node Set 1"
      Coordinate: "x"
      Value: "1.0e5*t"
      Type: Dirichlet
    BC_2:
      Variable: "Displacements"
      Node Set: "Node Set 2"
      Coordinate: "x"
      Value: "0.0"
      Type: Dirichlet
  Solver:
    Damage Models: True
    Initial Time: 0.0
    Final Time: 5.0e-6
    Verlet:
      Safety Factor: 0.9
  Outputs:
    Output1:
      Output File Type: Exodus
      Output Filename: "partial_damage"
      Output Frequency: 1
      Output Variables:
        Displacements: True
        Damage: True
