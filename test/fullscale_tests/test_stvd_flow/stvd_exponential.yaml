PeriLab:
  Discretization:
    Node Sets:
      Node Set 1: ns_foil.txt
    Type: "Text File"
    Input Mesh File: "stvd_mesh.txt"
  Models:
    Material Models:
      Dummy:
        Material Model: "PD Solid Elastic"
        Symmetry: "isotropic plane stress"
        Young's Modulus: 1.0
        Poisson's Ratio: 0.25
    Thermal Models:
      STVD:
        Thermal Model: "STVD Flow"
        Thermal Conductivity: 3.7415495840
        Reaction Rate: 1.0
        Reaction Law: "Exponential"
        Core Size: 0.5
        Diffusant Block ID: 2
  Blocks:
    block_1:
      Block ID: 1
      Material Model: "Dummy"
      Thermal Model: "STVD"
      Density: 1.0
      Horizon: 0.1750
      Specific Heat Capacity: 1.0
    block_2:
      Block ID: 2
      Material Model: "Dummy"
      Thermal Model: "STVD"
      Density: 1.0
      Horizon: 0.1750
      Specific Heat Capacity: 1.0
  Boundary Conditions:
    IC_foil:
      Variable: "Temperature"
      Node Set: "Node Set 1"
      Value: "1.0"
      Type: Initial
  Solver:
    Material Models: False
    Thermal Models: True
    Initial Time: 0.0
    Final Time: 0.5
    Verlet:
      Safety Factor: 1.0
      Fixed dt: 0.002
  Outputs:
    Output1:
      Output Filename: "stvd_exponential"
      Output File Type: Exodus
      Number of Output Steps: 5
      Output Variables:
        Temperature: True
