      Compute Property: "x"
    sensor_9_uy:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_9"
      Variable: "Displacements"
      Compute Property: "y"
  Outputs:
    Field_Exodus:
      Output File Type: "Exodus"
      Output Filename: "cb_mat_point"
      Output Frequency: 1
      Output Variables:
        Displacements: true
        Velocity: true
        Cauchy Stress: true
