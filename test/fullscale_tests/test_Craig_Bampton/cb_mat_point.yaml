PeriLab:
  Discretization:
    Type: "Text File"
    Input Mesh File: "mesh.txt"
    Node Sets:
      Excitation: "ns_excitation.txt"
      Outlet: "ns_outlet.txt"
  Models:
    Material Models:
      Matrix:
        Material Model: "Correspondence Elastic"
        Symmetry: "isotropic plane strain"
        Linear Strain: true
        Young's Modulus: 3.000000e+09
        Poisson's Ratio: 0.35
        Zero Energy Control: "Global"
  Blocks:
    block_inlet:
      Block ID: 1
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    block_reduced:
      Block ID: 2
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    block_outlet:
      Block ID: 3
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    sensor_4:
      Block ID: 4
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    sensor_5:
      Block ID: 5
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    sensor_6:
      Block ID: 6
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    sensor_7:
      Block ID: 7
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    sensor_8:
      Block ID: 8
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
    sensor_9:
      Block ID: 9
      Material Model: "Matrix"
      Density: 1200.0
      Horizon: 2.412000000e-03
  Boundary Conditions:
    Pressure Pulse:
      Variable: "Displacements"
      Node Set: "Excitation"
      Coordinate: "x"
      Value: "1.0e-4*sin(2*pi*4.500000e+04*t)*sin(pi*t/6.666667e-05)^2*(t<=6.666667e-05)"
  Solver:
    Material Models: true
    Damage Models: false
    Initial Time: 0.0
    Final Time: 1.250000e-04
    Verlet Matrix Based:
      Safety Factor: 0.9
      Numerical Damping: 0.00
      Model Reduction:
        Type: "Craig Bampton"
        Reduction Blocks: "2"
        Number of Modes: 8
        Material Point Region: false
  Compute Class Parameters:
    sensor_4_ux:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_4"
      Variable: "Displacements"
      Compute Property: "x"
    sensor_4_uy:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_4"
      Variable: "Displacements"
      Compute Property: "y"
    sensor_5_ux:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_5"
      Variable: "Displacements"
      Compute Property: "x"
    sensor_5_uy:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_5"
      Variable: "Displacements"
      Compute Property: "y"
    sensor_6_ux:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_6"
      Variable: "Displacements"
      Compute Property: "x"
    sensor_6_uy:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_6"
      Variable: "Displacements"
      Compute Property: "y"
    sensor_7_ux:
      Compute Class: "Block_Data"
      Calculation Type: "Maximum"
      Block: "sensor_7"
      Variable: "Displacements"
      Compute Property: "x"
    sensor_7_uy:
      Compute Class: "Block_Data"
